version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: eduscribe_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      # MEDIUM-003 / SEC-001: Never commit a real password here.
      # Set POSTGRES_PASSWORD in your local .env file (which is gitignored).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-eduscribe}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-eduscribe}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: eduscribe_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduscribe_backend
    ports:
      - "5001:5001"
    environment:
      - REDIS_URL=redis://eduscribe_redis:6379/0
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/storage:/app/storage
      - paddlex_models:/root/.paddlex
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduscribe_worker
    command: ["arq", "worker.WorkerSettings"]
    environment:
      - REDIS_URL=redis://eduscribe_redis:6379/0
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/storage:/app/storage
      - paddlex_models:/root/.paddlex
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5001
    container_name: eduscribe_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  paddlex_models:
