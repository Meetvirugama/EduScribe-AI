# litellm_config.yaml — LiteLLM Proxy Configuration for EduScribe AI
#
# This file is the single source of truth for all LLM provider routing,
# key management, budget enforcement, fallback chains, and observability.
#
# Run the proxy: docker run -v ./litellm_config.yaml:/app/config.yaml
#                           -p 4000:4000
#                           ghcr.io/berriai/litellm:main-latest
#                           --config /app/config.yaml
#
# Application code connects to: http://litellm-proxy:4000/chat/completions
# All Celery workers share this single proxy endpoint.
#
# LLD Reference: §16.2 LiteLLM Proxy (Self-Hosted Gateway)
#                §16.2 Minimal config.yaml for EduScribe AI
#                §15.1 The Four-Tier Waterfall
# ------------------------------------------------------------------------------

model_list:
  # ── TIER 1 — PREMIUM FREE ──────────────────────────────────────────────────
  # Best quality · Large context · Primary default
  # Gemini 2.5 Flash: 1M context, multimodal, 10.0/10  # Gemini Key 1: Lecture Note Generation (primary)
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY_1

  # Gemini Key 2: OCR & Image Understanding (Vision Router primary)
  - model_name: gemini-flash-ocr
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY_2

  # Gemini Key 3: HTML Notes & Markdown Formatting
  - model_name: gemini-flash-markdown
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY_3

  # Gemini Key 4: Backup / overflow
  - model_name: gemini-flash-backup
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY_4

  - model_name: gemini-flash-lite
    litellm_params:
      model: gemini/gemini-2.5-flash-lite-preview-06-17
      api_key: os.environ/GEMINI_API_KEY_1

  # OpenRouter — 5 keys for load distribution across free models ───────────────
  # Key 1: DeepSeek V3 (primary coding + general)
  - model_name: deepseek-v3
    litellm_params:
      model: openrouter/deepseek/deepseek-chat:free
      api_key: os.environ/OPENROUTER_API_KEY_1

  # Key 2: DeepSeek V3 overflow / Qwen
  - model_name: deepseek-v3-key2
    litellm_params:
      model: openrouter/deepseek/deepseek-chat:free
      api_key: os.environ/OPENROUTER_API_KEY_2

  # DeepSeek R1: chain-of-thought math
  - model_name: deepseek-r1
    litellm_params:
      model: openrouter/deepseek/deepseek-r1:free
      api_key: os.environ/OPENROUTER_API_KEY_1

  # Qwen3 235B: 9.9/10 mathematics, highest MATH-500/AIME scores; primary for math
  - model_name: qwen3-235b
    litellm_params:
      model: openrouter/qwen/qwen3-235b-a22b:free
      api_key: os.environ/OPENROUTER_API_KEY_3

  # Qwen3 Coder 480B: largest open-weight code model; primary for code generation
  - model_name: qwen3-coder
    litellm_params:
      model: openrouter/qwen/qwen3-coder-480b-a35b:free
      api_key: os.environ/OPENROUTER_API_KEY_4

  # ── TIER 2 — HIGH-SPEED FREE ───────────────────────────────────────────────
  # Very low latency · Ultra-fast token generation
  # ── TIER 3 — OPEN-SOURCE BACKUP ────────────────────────────────────────────
  # ── SUPPLEMENTARY — EMBEDDING & SEARCH ───────────────────────────────────────
  # Embedding Router — Jina AI (primary RAG pipeline)
  - model_name: jina-embeddings
    litellm_params:
      model: jina_ai/jina-embeddings-v3
      api_key: os.environ/JINA_API_KEY

  # Embedding Router — Cohere Reranking (Key 1)
  - model_name: cohere-rerank
    litellm_params:
      model: cohere/rerank-english-v3.0
      api_key: os.environ/COHERE_API_KEY_1

  # Embedding Router — Cohere Embeddings (Key 2)
  - model_name: cohere-embed
    litellm_params:
      model: cohere/embed-english-v3.0
      api_key: os.environ/COHERE_API_KEY_2

  # Dev/Test ONLY — GitHub Models (NOT for production)
  - model_name: github-gpt4o
    litellm_params:
      model: github/gpt-4o
      api_key: os.environ/GITHUB_MODELS_TOKEN

  # Vision Router / Edge — Cloudflare Workers AI
  - model_name: cloudflare-llama          # Key 1: edge LLM
    litellm_params:
      model: cloudflare/@cf/meta/llama-3.3-70b-instruct-fp8-fast
      api_key: os.environ/CLOUDFLARE_API_KEY_1

  - model_name: cloudflare-bge-embed      # Key 2: edge embedding
    litellm_params:
      model: cloudflare/@cf/baai/bge-m3
      api_key: os.environ/CLOUDFLARE_API_KEY_2

  - model_name: cloudflare-whisper        # Key 3: edge speech-to-text
    litellm_params:
      model: cloudflare/@cf/openai/whisper-large-v3-turbo
      api_key: os.environ/CLOUDFLARE_API_KEY_3

  - model_name: cloudflare-edge-chat      # Key 4: edge chat
    litellm_params:
      model: cloudflare/@cf/meta/llama-3.3-70b-instruct-fp8-fast
      api_key: os.environ/CLOUDFLARE_API_KEY_4

  # Embedding Router — Hugging Face (BGE-M3 primary)
  - model_name: hf-bge-m3
    litellm_params:
      model: huggingface/BAAI/bge-m3
      api_key: os.environ/HF_API_KEY_1

  - model_name: hf-e5-mistral
    litellm_params:
      model: huggingface/intfloat/e5-mistral-7b-instruct
      api_key: os.environ/HF_API_KEY_2


# ------------------------------------------------------------------------------
# Router Settings — Four-Tier Waterfall Fallback Chain
# LLD Reference: §15.1 The Four-Tier Waterfall, §16.2 config.yaml
# ------------------------------------------------------------------------------
router_settings:
  routing_strategy: usage-based-routing
  num_retries: 3
  retry_after: 5
  # Fallback chain: exhausting the leftmost model triggers the next
  fallbacks:
    - gemini-flash:
        - gemini-flash-key2
        - gemini-flash-key3
        - gemini-flash-lite
        - deepseek-v3
        - qwen3-235b
        - groq-llama33
        - groq-llama8b
    - deepseek-v3:
        - qwen3-235b
        - groq-llama33
        - groq-llama8b
    - qwen3-235b:
        - deepseek-r1
        - groq-qwen3
        - groq-llama33
    - groq-llama33:
        - groq-llama33-key2
        - groq-llama8b
  # Context window fallback: route to Gemini (1M) if prompt exceeds smaller models
  context_window_fallback_dict:
    groq-llama33: gemini-flash
    deepseek-v3: gemini-flash
    qwen3-235b: gemini-flash


# ------------------------------------------------------------------------------
# LiteLLM Settings — Observability and Global Behaviour
# LLD Reference: §16.2 LiteLLM Proxy
# ------------------------------------------------------------------------------
litellm_settings:
  # Zero-code Langfuse observability for every LLM call (§23 Technology Stack)
  success_callback:
    - langfuse
  failure_callback:
    - langfuse
  request_timeout: 120
  # drop_params: strip unsupported parameters rather than raising errors
  drop_params: true
  # Telemetry: disable sending data to LiteLLM's servers
  telemetry: false


# ------------------------------------------------------------------------------
# General Settings
# ------------------------------------------------------------------------------
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Store usage stats in the proxy's own Postgres instance
  store_model_in_db: true
